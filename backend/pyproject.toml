[project]
name = "cue-player-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.52,<0.53",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.19,<1.20",
  "httpx>=0.28,<0.29",
  "yt-dlp>=2026.8.19,<2027",
  "webvtt-py>=0.5.1,<0.6",
  "faster-whisper>=1.2.1,<1.3",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
